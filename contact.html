<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HACK-WIRE News • Contact</title>

  <style>
    :root{
      --bg0:#060711; --bg1:#090a16; --text:#e9ecff; --muted:#a7add6; --line: rgba(140, 160, 255, .18);
      --radius2: 22px; --shadow: 0 18px 50px rgba(0,0,0,.55);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family:var(--sans); color:var(--text);
      background:
        radial-gradient(900px 500px at 12% 12%, rgba(45,247,255,.18), transparent 55%),
        radial-gradient(800px 450px at 82% 18%, rgba(168,107,255,.20), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:28px 18px 60px; }
    header{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding:16px 16px 18px;
      border:1px solid var(--line);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      background: linear-gradient(180deg, rgba(12,14,32,.62), rgba(8,9,22,.42));
      backdrop-filter: blur(10px);
      position:sticky; top:14px; z-index:10;
    }
    .brand{ display:flex; align-items:center; gap:14px; min-width:220px; }
    .logo{ width:124px; height:110px; border-radius:14px; object-fit:cover; border:1px solid rgba(140,160,255,.25); }
    .brand h1{ margin:0; font-size:16px; letter-spacing:.18em; text-transform:uppercase; }
    .brand p{ margin:4px 0 0; font-size:12px; color:var(--muted); font-family:var(--mono); }
    nav{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .chip{
      text-decoration:none; color:var(--text); font-size:12px; padding:10px 12px; border-radius:999px;
      border:1px solid rgba(140,160,255,.18); background: rgba(8,10,22,.35);
      font-family: var(--mono);
    }
    .panel{
      margin-top:16px;
      border-radius: var(--radius2);
      border:1px solid var(--line);
      background: rgba(10,12,28,.45);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel-header{
      padding:16px 16px 12px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom: 1px solid rgba(140,160,255,.14);
      background: linear-gradient(180deg, rgba(16,18,46,.55), rgba(10,12,28,.20));
    }
    .panel-header h3{
      margin:0; font-size:14px; letter-spacing:.16em; text-transform:uppercase; font-family: var(--mono);
    }
    .content{ padding:16px; line-height:1.8; font-size:15.5px; }
    .content h1{ margin:0 0 10px; font-size:26px; }
    .content p{ color: rgba(233,236,255,.93); margin:10px 0; }
    .list a{
      display:block;
      font-family: var(--mono);
      color: var(--text);
      text-decoration:none;
      padding:8px 10px;
      border:1px solid rgba(140,160,255,.16);
      border-radius:12px;
      background: rgba(8,10,22,.18);
      margin:8px 0;
    }
    footer{
      margin-top:44px; padding:18px 6px 0;
      color: rgba(167,173,214,.85); font-family: var(--mono); font-size:12px; text-align:center;
    }
    a{ color:inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <a class="btn" href="index.html">
          <img class="logo" src="Icon.png" alt="Your site logo" width="453" height="384" />
          <div>
            <h1>HACKED-WIRE NEWS</h1>
            <p>Home</p>
          </a>
        </div>
      </div>

      <nav aria-label="Site navigation">
        <a class="chip" href="index.html">Home</a>
        <a class="chip" href="about.html">About</a>
      </nav>
    </header>

    <main class="panel">
      <div class="panel-header">
        <h3>Contact:</h3>
        <div style="font-family:var(--mono); color:var(--muted); font-size:12px;"><h2>hacked-wire@proton.me</h2></div>
      </div>

      <div class="content">
        <h1>Find us here</h1>

        <div class="list">
          <br>Mastodon Social:<a href="https://mastodon.social/@hacked_wire_news" target="_blank" rel="noopener noreferrer">@hacked_wire_news</a>
          <br>Patreon: <a href="#" target="_blank" rel="noopener">(comming-soon)</a>
        </div>

        <p style="color:var(--muted); font-family:var(--mono); font-size:12.5px; margin-top:16px;">
          We need support!
        </p>
      </div>
    </main>

    <footer>
      © <span id="year">2026</span> Hacked_Wire_News •
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
